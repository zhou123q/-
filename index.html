<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="我的个人主页">
<title>你好，认识一下 · 个人主页</title>
<style>
:root{--bg:#f6f3ec;--ink:#222b29;--muted:#758079;--orange:#f68b55;--green:#244e43;--line:#dddcd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}button,input,textarea{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:5px}.wrap{max-width:1100px;margin:auto;padding:0 32px}header{height:98px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}.logo{font-size:15px;font-weight:800;letter-spacing:2px}.logo i{display:inline-block;width:10px;height:10px;background:var(--orange);border-radius:50%;margin-right:10px}.toplink{font-size:13px;color:var(--muted)}.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:50px;min-height:600px;padding:55px 0}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--green);display:flex;align-items:center;gap:10px}.dot{width:7px;height:7px;border-radius:50%;background:#5d9b69;box-shadow:0 0 0 5px #5d9b691a;animation:pulse 2.5s infinite}.hello{font-size:clamp(44px,6vw,74px);letter-spacing:-3px;line-height:1.15;margin:28px 0 10px}.name{display:block;overflow-wrap:anywhere}.name span{background:linear-gradient(transparent 72%,#ffd6b8 72%);padding-right:8px}.role{font-size:20px;line-height:1.6;color:var(--green);margin:22px 0 14px;overflow-wrap:anywhere}.bio{color:var(--muted);line-height:1.9;font-size:15px;max-width:430px;white-space:pre-line;overflow-wrap:anywhere}.contact{display:inline-flex;align-items:center;gap:26px;margin-top:20px;padding:15px 23px;border-radius:100px;background:var(--ink);color:#fff;font-size:14px;transition:transform .2s,background .2s}.contact:hover{background:var(--green);transform:translateY(-3px)}.stage{height:450px;position:relative;display:grid;place-items:center}.halo{position:absolute;width:350px;height:350px;border-radius:50%;background:#e7eadd;border:1px solid #d5dacb}.ring{position:absolute;width:390px;height:390px;border:1px dashed #b9c5b7;border-radius:50%;animation:rotate 65s linear infinite}.ring:after{content:"";position:absolute;width:15px;height:15px;background:var(--orange);border-radius:50%;left:47px;top:47px}.person{height:385px;width:320px;z-index:1;filter:drop-shadow(0 16px 12px #21423517);animation:bob 5s ease-in-out infinite}.wave{transform-origin:248px 230px;animation:wave 5s ease-in-out infinite}.eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}.badge{position:absolute;background:#fffdf8;border:1px solid #dedfd3;border-radius:12px;padding:12px 16px;z-index:2;box-shadow:0 9px 22px #27392d08;font-size:13px;animation:bob 5s ease-in-out infinite}.badge.one{top:40px;right:0;transform:rotate(7deg)}.badge.two{bottom:32px;left:0;animation-delay:-2s}.badge span{color:var(--orange);margin-right:8px}.star{position:absolute;font-size:38px;left:4px;top:70px;color:var(--orange);animation:rotate 20s linear infinite}.details{display:grid;grid-template-columns:.8fr 1.2fr;gap:35px;padding:34px 0 42px;border-top:1px solid var(--line)}.label{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:15px}.location{font-size:19px;overflow-wrap:anywhere}.tags{display:flex;gap:10px;flex-wrap:wrap}.tag{border:1px solid #d8ddd0;background:#edf0e5;border-radius:100px;padding:7px 16px;font-size:13px;overflow-wrap:anywhere;max-width:100%}footer{border-top:1px solid var(--line);padding:22px 0 32px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px}.enter{animation:appear .8s both}.hero .enter{animation-delay:.1s}.editor-button{border:1px solid #cdd4c8;background:transparent;border-radius:100px;padding:9px 16px;font-size:12px;color:var(--green)}.editor-button:hover{background:#e8ecdf}dialog{border:1px solid var(--line);border-radius:20px;width:min(550px,calc(100% - 28px));max-height:90dvh;padding:28px;color:var(--ink);background:#fffdf8;box-shadow:0 30px 100px #0003}dialog::backdrop{background:#13271f80;backdrop-filter:blur(6px)}.dialog-head{display:flex;align-items:center;justify-content:space-between}.dialog-head h2{font-size:22px;margin:0}.close{border:0;background:#eee;border-radius:50%;width:32px;height:32px}.hint{font-size:13px;color:var(--muted);line-height:1.7}form{display:grid;gap:14px}label{font-size:13px;display:grid;gap:7px}input,textarea{width:100%;border:1px solid #d5d9cf;border-radius:8px;padding:11px 12px;background:#fff;color:var(--ink);font-size:14px}textarea{resize:vertical;min-height:85px}input:focus,textarea:focus{outline:2px solid #73987a;outline-offset:1px}.actions{display:flex;gap:10px;margin-top:5px}.actions button{flex:1;border:0;border-radius:8px;padding:13px 10px;background:#e7ebdf;color:var(--green);font-size:13px}.actions .primary{background:var(--green);color:white}.status{min-height:19px;font-size:12px;color:var(--green);margin:0}.empty-contact{display:none}@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}@keyframes rotate{to{rotate:360deg}}@keyframes pulse{50%{box-shadow:0 0 0 8px #5d9b6905}}@keyframes wave{0%,12%,100%{rotate:0deg}3%,9%{rotate:-12deg}6%{rotate:7deg}}@keyframes blink{0%,43%,47%,100%{scale:1 1}45%{scale:1 .12}}@keyframes appear{from{opacity:0;translate:0 15px}to{opacity:1;translate:0 0}}@media(max-width:760px){.wrap{padding:0 24px}header{height:80px}.hero{grid-template-columns:1fr;gap:15px;padding:40px 0 25px;min-height:0}.hello{font-size:52px;margin-top:22px}.stage{height:375px;max-width:400px;width:100%;margin:auto}.halo{width:280px;height:280px}.ring{width:315px;height:315px}.person{height:325px;width:270px}.badge.one{top:15px;right:0}.badge.two{bottom:10px;left:0}.star{font-size:28px;top:40px}.details{grid-template-columns:1fr;gap:25px}.bio{max-width:none}footer{font-size:11px}.toplink{display:none}}@media(max-width:360px){.hello{font-size:43px}.ring{width:265px;height:265px}.halo{width:245px;height:245px}.badge{font-size:11px;padding:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="enter"><a class="logo" href="#home"><i></i>MY LITTLE SPACE</a><button class="editor-button" id="editButton" type="button">✎ 填写我的资料</button></header>
<main id="home">
<section class="hero">
<div class="enter"><div class="eyebrow"><span class="dot"></span>HELLO, WORLD!</div><h1 class="hello">你好，我是<span class="name"><span id="profileName">你的名字</span>。</span></h1><p class="role" id="profileRole">写一句你的身份或座右铭</p><p class="bio" id="profileBio">这里是你的个人小天地。写下你的介绍，让第一次来到这里的人认识你。</p><a class="contact" id="contactLink" href="#about">认识我一下 <span>↗</span></a></div>
<div class="stage" aria-label="一位微笑挥手的男生卡通形象"><div class="halo"></div><div class="ring" aria-hidden="true"></div><div class="star" aria-hidden="true">✳</div><div class="badge one"><span>✦</span>保持好奇</div>
<svg class="person" viewBox="0 0 320 390" role="img" aria-label="穿绿色外套、微笑挥手的男生">
<defs><linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3f7865"/><stop offset="1" stop-color="#234e42"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7ceac"/><stop offset="1" stop-color="#e8af89"/></linearGradient></defs>
<ellipse cx="160" cy="371" rx="104" ry="10" fill="#213f2e" opacity=".1"/>
<path d="M104 310L99 371H153L161 323L169 371H224L214 308Z" fill="#273332"/>
<path d="M109 196Q79 201 64 231L51 302Q50 324 68 326Q85 329 92 303L102 265Z" fill="#376955"/>
<path d="M57 309Q51 331 64 339Q80 344 85 324L85 313" fill="url(#skin)"/>
<path d="M118 191L204 191Q227 207 227 249L218 326Q160 340 96 324L96 237Q95 205 118 191Z" fill="url(#jacket)"/>
<path d="M135 187L159 201L184 187L196 323Q162 329 125 321Z" fill="#f6f0df"/>
<path d="M136 189L119 198L123 226L136 217L129 248L116 324" fill="#4e886e"/>
<path d="M184 189L202 199L199 224L185 218L193 248L206 326" fill="#356651"/>
<path d="M142 161V188Q159 208 178 188V160" fill="#e7ac86"/>
<g class="wave"><path d="M207 204Q226 201 240 227L249 235L268 198L292 210L271 264Q261 283 244 277L219 259" fill="#3b725c"/><path d="M267 202L269 182L263 161Q261 153 267 151Q273 149 276 158L280 169L280 135Q280 127 286 128Q292 128 291 136L292 165L296 142Q298 134 303 137Q307 139 305 146L302 170L308 156Q311 150 316 153Q320 156 315 164L305 188Q303 205 289 212Z" fill="url(#skin)"/><path d="M280 175Q293 173 297 185" stroke="#c58764" stroke-width="2" fill="none" stroke-linecap="round"/></g>
<ellipse cx="113" cy="122" rx="12" ry="18" fill="#ecb38c"/><ellipse cx="207" cy="122" rx="12" ry="18" fill="#ecb38c"/>
<path d="M111 85Q113 48 160 48Q209 48 209 94L204 142Q195 178 163 183Q129 178 116 148Z" fill="url(#skin)"/>
<path d="M111 121Q97 99 107 72Q96 49 123 40Q141 15 166 33Q198 26 213 52Q227 77 208 119L202 91Q178 90 156 66Q145 92 118 94Z" fill="#293332"/>
<path d="M124 54Q145 36 163 45M170 44Q190 41 203 59" fill="none" stroke="#47504a" stroke-width="5" stroke-linecap="round"/>
<path d="M127 111Q138 106 147 110M175 110Q185 106 194 111" stroke="#493b32" stroke-width="4" fill="none" stroke-linecap="round"/>
<ellipse class="eye" cx="139" cy="122" rx="4" ry="5" fill="#303631"/><ellipse class="eye" cx="184" cy="122" rx="4" ry="5" fill="#303631"/>
<path d="M161 122L158 137L165 138" stroke="#cc9270" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<ellipse cx="130" cy="139" rx="10" ry="5" fill="#e6a089" opacity=".55"/><ellipse cx="193" cy="139" rx="10" ry="5" fill="#e6a089" opacity=".55"/>
<path d="M145 148Q161 159 178 147Q163 174 145 148Z" fill="#8f5744"/><path d="M149 150Q161 156 174 149" stroke="#fff8e9" stroke-width="4" fill="none"/>
<path d="M100 280L119 280M201 281L220 281" stroke="#a6c4aa" stroke-width="2" opacity=".6"/>
</svg><div class="badge two"><span>↗</span>认真生活，自由生长</div></div>
</section>
<section class="details" id="about"><div><div class="label">BASED IN / 所在地</div><div class="location" id="profileLocation">填写你所在的城市</div></div><div><div class="label">THINGS I LOVE / 我的兴趣</div><div class="tags" id="profileTags"><span class="tag">你的爱好</span><span class="tag">你的热爱</span><span class="tag">你的灵感</span></div></div></section>
</main><footer><span>© <span id="footerName">你的名字</span> · 很高兴认识你</span><span>一点好奇，一点热爱。</span></footer>
</div>
<dialog id="editor"><div class="dialog-head"><h2>让这里变成你的主页</h2><button type="button" class="close" id="closeEditor" aria-label="关闭">×</button></div><p class="hint">填好后可以先预览，再下载网页上传。这里填写的资料会展示在公开主页上；邮箱可以留空。</p><form id="profileForm">
<label>你的名字<input name="name" maxlength="20" placeholder="例如：小宇" required></label>
<label>身份 / 一句话介绍<input name="role" maxlength="60" placeholder="例如：视频创作者 / 喜欢探索 AI 的普通人"></label>
<label>关于自己<textarea name="bio" maxlength="400" placeholder="介绍一下你在做的事，以及你喜欢的生活。"></textarea></label>
<label>所在城市<input name="location" maxlength="40" placeholder="例如：中国 · 杭州"></label>
<label>兴趣标签（用逗号分隔）<input name="tags" maxlength="100" placeholder="摄影，旅行，AI，电影"></label>
<label>联系邮箱（选填）<input name="email" type="email" maxlength="120" placeholder="hello@example.com"></label>
<div class="actions"><button type="submit">先看效果</button><button class="primary" type="button" id="downloadButton">下载填写好的网页 ↓</button></div><p class="status" id="status" role="status"></p>
</form></dialog>
<script>
(() => {
const $=id=>document.getElementById(id), form=$('profileForm');
const defaults={name:'你的名字',role:'写一句你的身份或座右铭',bio:'这里是你的个人小天地。写下你的介绍，让第一次来到这里的人认识你。',location:'填写你所在的城市',tags:'你的爱好，你的热爱，你的灵感',email:''};
let values={...defaults};
try{const saved=JSON.parse(localStorage.getItem('personal-home-demo-v1')||'null');if(saved&&typeof saved==='object')for(const key in defaults)if(typeof saved[key]==='string')values[key]=saved[key];}catch(e){}
function render(){ $('profileName').textContent=values.name||defaults.name;$('footerName').textContent=values.name||defaults.name;$('profileRole').textContent=values.role;$('profileBio').textContent=values.bio;$('profileLocation').textContent=values.location||'保持探索';$('profileTags').replaceChildren();values.tags.split(/[,，、]/).map(s=>s.trim()).filter(Boolean).slice(0,8).forEach(t=>{const el=document.createElement('span');el.className='tag';el.textContent=t;$('profileTags').append(el)});const link=$('contactLink');link.href=values.email?'mailto:'+values.email:'#about';link.replaceChildren(document.createTextNode(values.email?'和我打个招呼 ':'认识我一下 '));const arrow=document.createElement('span');arrow.textContent='↗';link.append(arrow);document.title=(values.name||defaults.name)+' · 个人主页'; }
function save(){for(const key in defaults)values[key]=form.elements.namedItem(key).value.trim();render();try{localStorage.setItem('personal-home-demo-v1',JSON.stringify(values));}catch(e){}}
$('editButton').addEventListener('click',()=>{for(const key in defaults)form.elements.namedItem(key).value=values[key]===defaults[key]?'':values[key];$('status').textContent='';$('editor').showModal();});
$('closeEditor').addEventListener('click',()=>$('editor').close());
form.addEventListener('submit',e=>{e.preventDefault();save();$('editor').close();});
$('downloadButton').addEventListener('click',()=>{if(!form.reportValidity())return;save();const doc=document.documentElement.cloneNode(true);doc.querySelector('#editor').remove();doc.querySelector('#editButton').remove();doc.querySelectorAll('script').forEach(el=>el.remove());const blob=new Blob(['<!DOCTYPE html>\n'+doc.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='index.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);$('status').textContent='已发起下载。上传下载的 index.html，页面会保留动画，不显示编辑按钮。';});
render();
})();
</script>
</body>
</html>
